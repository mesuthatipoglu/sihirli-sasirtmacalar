<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kısık Göz İllüzyonu Stüdyosu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .app-layout {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 2rem;
            align-items: start;
        }
        @media (max-width: 920px) {
            .app-layout { grid-template-columns: 1fr; }
        }
        .panel {
            background: var(--surface-light);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.4rem;
            display: flex;
            flex-direction: column;
            gap: 1.1rem;
        }
        .canvas-stage {
            background: #111622;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.15rem;
        }
        .canvas-viewport {
            width: 100%;
            height: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #808080;
            border-radius: 10px;
            position: relative;
        }
        canvas {
            max-width: 100%;
            max-height: 100%;
            transition: transform 0.12s ease-out, filter 0.12s ease-out;
            border-radius: 6px;
        }
        .mode-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }
        .tab-btn {
            background: rgba(255,255,255,0.07);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.65rem 0.6rem;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .tab-btn:hover, .tab-btn.active {
            background: var(--accent-cyan);
            color: #000;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px var(--accent-glow);
        }
        .preset-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }
        .preset-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.55rem 0.65rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .preset-btn:hover, .preset-btn.active {
            background: rgba(0, 242, 255, 0.18);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }
        .squint-bar {
            width: 100%;
            background: rgba(0, 242, 255, 0.08);
            border: 1px solid var(--accent-cyan);
            border-radius: 10px;
            padding: 0.85rem 1.2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1rem;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header class="app-header">
        <a href="../index.html" class="back-btn">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"></path></svg>
            Ana Menü
        </a>
        <h1 class="app-title">Kısık Göz İllüzyonu Stüdyosu</h1>
        <p class="app-subtitle">Gözlerinizi %70 kıstığınızda (veya telefondan/ekrandan uzaklaştığınızda) çizgilerin arasından gizli portrenin ve mesajın belirdiği iki farklı optik teknik!</p>
    </header>

    <div class="app-layout">
        <div class="panel">
            <div>
                <label class="form-label">1. İllüzyon Tekniği Seçin</label>
                <div class="mode-tabs">
                    <button class="tab-btn active" data-tech="stripes">🦓 Op-Art Çizgi Maskesi (Viral %70 Kıs)</button>
                    <button class="tab-btn" data-tech="hybrid">👥 Çift Portre Hibrit (Einstein ↔ Marilyn)</button>
                </div>
            </div>

            <div>
                <label class="form-label">2. Hazır Gizli Hedef Seçin</label>
                <div class="preset-grid">
                    <button class="preset-btn active" data-preset="portrait">🕵️ Gizemli Portre</button>
                    <button class="preset-btn" data-preset="cat">🐱 Gizli Kedi Yüzü</button>
                    <button class="preset-btn" data-preset="skull">💀 Gizli Kafatası</button>
                    <button class="preset-btn" data-preset="text">🔤 Özel Metin / Foto</button>
                </div>
            </div>

            <div class="form-group" id="customTextGroup" style="margin:0; display:none;">
                <label class="form-label">Gizlenecek Metin</label>
                <input type="text" id="textInput" class="form-control" value="SENİ SEVİYORUM" maxlength="18">
            </div>

            <div class="form-group" style="margin:0;">
                <label class="form-label">Veya Kendi Fotoğrafınızı Gizleyin</label>
                <input type="file" id="imageInput" class="form-control" accept="image/*">
            </div>

            <div class="form-group" style="margin:0;">
                <label class="form-label" style="display:flex; justify-content:space-between;">
                    <span id="slider1Title">Çizgi Sıklığı (Frekans)</span>
                    <span id="slider1Val" style="color:var(--accent-cyan);">7px</span>
                </label>
                <input type="range" id="slider1" style="width:100%" min="4" max="14" value="7">
            </div>

            <div class="form-group" style="margin:0;">
                <label class="form-label" style="display:flex; justify-content:space-between;">
                    <span id="slider2Title">Gizlilik / Kontrast Gücü</span>
                    <span id="slider2Val" style="color:var(--accent-cyan);">52%</span>
                </label>
                <input type="range" id="slider2" style="width:100%" min="25" max="80" value="52">
            </div>

            <button class="primary-btn" id="downloadBtn" style="width:100%;">💾 Resmi PNG Olarak İndir</button>
        </div>

        <div class="canvas-stage">
            <div class="canvas-viewport">
                <canvas id="mainCanvas" width="700" height="480"></canvas>
            </div>

            <div class="squint-bar">
                <span style="font-weight:800; color:var(--accent-cyan); white-space:nowrap;">👁️ Göz Kısma / Uzaklaşma Simülatörü:</span>
                <input type="range" id="squintSlider" min="0" max="100" value="0" style="flex:1; min-width:150px;">
                <button class="preset-btn" id="quickSquintBtn" style="white-space:nowrap;">✨ Basılı Tut: Gözleri Kıs</button>
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const textInput = document.getElementById('textInput');
    const customTextGroup = document.getElementById('customTextGroup');
    const imageInput = document.getElementById('imageInput');
    const slider1 = document.getElementById('slider1');
    const slider1Val = document.getElementById('slider1Val');
    const slider2 = document.getElementById('slider2');
    const slider2Val = document.getElementById('slider2Val');
    const squintSlider = document.getElementById('squintSlider');
    const quickSquintBtn = document.getElementById('quickSquintBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    let currentTech = 'stripes'; // 'stripes' or 'hybrid'
    let currentPreset = 'portrait';
    let customImg = null;

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentTech = btn.dataset.tech;
            render();
        });
    });

    document.querySelectorAll('.preset-btn[data-preset]').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.preset-btn[data-preset]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentPreset = btn.dataset.preset;
            customTextGroup.style.display = currentPreset === 'text' ? 'block' : 'none';
            render();
        });
    });

    imageInput.addEventListener('change', e => {
        if (!e.target.files[0]) return;
        const reader = new FileReader();
        reader.onload = ev => {
            const img = new Image();
            img.onload = () => {
                customImg = img;
                currentPreset = 'custom_img';
                document.querySelectorAll('.preset-btn[data-preset]').forEach(b => b.classList.remove('active'));
                render();
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
    });

    [textInput, slider1, slider2].forEach(el => {
        el.addEventListener('input', () => {
            slider1Val.innerText = slider1.value + 'px';
            slider2Val.innerText = slider2.value + '%';
            render();
        });
    });

    function applySquintEffect(val) {
        squintSlider.value = val;
        const v = val / 100;
        const scale = 1 - v * 0.72;
        const blur = v * 4.2;
        canvas.style.transform = `scale(${scale})`;
        canvas.style.filter = `blur(${blur}px) contrast(${1 + v * 0.35})`;
    }

    squintSlider.addEventListener('input', () => {
        applySquintEffect(parseInt(squintSlider.value));
    });

    quickSquintBtn.addEventListener('mousedown', () => applySquintEffect(75));
    window.addEventListener('mouseup', () => {
        if (parseInt(squintSlider.value) === 75) applySquintEffect(0);
    });
    quickSquintBtn.addEventListener('touchstart', () => applySquintEffect(75), {passive: true});
    window.addEventListener('touchend', () => {
        if (parseInt(squintSlider.value) === 75) applySquintEffect(0);
    });

    downloadBtn.addEventListener('click', () => {
        const a = document.createElement('a');
        a.download = 'kisik-goz-illuzyonu.png';
        a.href = canvas.toDataURL();
        a.click();
    });

    // Draw smooth shaded target image (0..255 luminance) onto an offscreen canvas
    function buildHiddenTargetCanvas(W, H) {
        const c = document.createElement('canvas');
        c.width = W; c.height = H;
        const cx = c.getContext('2d');

        // Neutral middle gray background
        cx.fillStyle = 'rgb(128, 128, 128)';
        cx.fillRect(0, 0, W, H);

        if (currentPreset === 'custom_img' && customImg) {
            const scale = Math.max(W / customImg.width, H / customImg.height);
            const ix = (W - customImg.width * scale) / 2;
            const iy = (H - customImg.height * scale) / 2;
            cx.drawImage(customImg, ix, iy, customImg.width * scale, customImg.height * scale);
            return c;
        }

        const midX = W / 2, midY = H / 2;

        if (currentPreset === 'portrait') {
            // Iconic high-contrast shaded portrait (Mona Lisa / Mystery Face with strong 3D chiaroscuro!)
            // Dark hair silhouette
            cx.fillStyle = 'rgb(20, 20, 20)';
            cx.beginPath();
            cx.ellipse(midX, midY + 10, 175, 215, 0, 0, Math.PI * 2);
            cx.fill();

            // Bright sculpted face oval
            const faceG = cx.createRadialGradient(midX - 20, midY - 20, 20, midX, midY, 150);
            faceG.addColorStop(0, 'rgb(250, 250, 250)');
            faceG.addColorStop(0.7, 'rgb(205, 205, 205)');
            faceG.addColorStop(1, 'rgb(70, 70, 70)');
            cx.fillStyle = faceG;
            cx.beginPath();
            cx.ellipse(midX, midY + 5, 125, 162, 0, 0, Math.PI * 2);
            cx.fill();

            // Deep dark eye sockets & eyebrows
            cx.fillStyle = 'rgb(15, 15, 15)';
            [-52, 52].forEach(ox => {
                cx.beginPath();
                cx.ellipse(midX + ox, midY - 28, 30, 18, 0, 0, Math.PI * 2);
                cx.fill();
                // Bright eye highlight
                cx.fillStyle = 'rgb(245, 245, 245)';
                cx.beginPath();
                cx.arc(midX + ox, midY - 28, 8, 0, Math.PI * 2);
                cx.fill();
                cx.fillStyle = 'rgb(15, 15, 15)';
            });

            // Nose shadow
            cx.fillStyle = 'rgb(45, 45, 45)';
            cx.beginPath();
            cx.moveTo(midX, midY - 25);
            cx.lineTo(midX - 22, midY + 38);
            cx.lineTo(midX + 22, midY + 38);
            cx.closePath();
            cx.fill();

            // Expressive dark smile
            cx.lineWidth = 14;
            cx.strokeStyle = 'rgb(20, 20, 20)';
            cx.lineCap = 'round';
            cx.beginPath();
            cx.arc(midX, midY + 45, 58, 0.18 * Math.PI, 0.82 * Math.PI);
            cx.stroke();
        } else if (currentPreset === 'cat') {
            // Big Shaded Cat Face with bright eyes & whiskers
            cx.fillStyle = 'rgb(25, 25, 25)';
            // Left & Right pointed ears
            cx.beginPath();
            cx.moveTo(midX - 155, midY - 40);
            cx.lineTo(midX - 135, midY - 195);
            cx.lineTo(midX - 35, midY - 125);
            cx.moveTo(midX + 155, midY - 40);
            cx.lineTo(midX + 135, midY - 195);
            cx.lineTo(midX + 35, midY - 125);
            cx.fill();

            // Head circle
            const catG = cx.createRadialGradient(midX, midY, 20, midX, midY, 175);
            catG.addColorStop(0, 'rgb(245, 245, 245)');
            catG.addColorStop(0.65, 'rgb(190, 190, 190)');
            catG.addColorStop(1, 'rgb(30, 30, 30)');
            cx.fillStyle = catG;
            cx.beginPath();
            cx.arc(midX, midY + 10, 160, 0, Math.PI * 2);
            cx.fill();

            // Large dark cat eyes with vertical slit pupils
            [-62, 62].forEach(ox => {
                cx.fillStyle = 'rgb(15, 15, 15)';
                cx.beginPath();
                cx.ellipse(midX + ox, midY - 20, 36, 28, ox < 0 ? 0.15 : -0.15, 0, Math.PI * 2);
                cx.fill();
                cx.fillStyle = 'rgb(250, 250, 250)';
                cx.beginPath();
                cx.ellipse(midX + ox, midY - 20, 10, 22, 0, 0, Math.PI * 2);
                cx.fill();
            });

            // Nose triangle & mouth
            cx.fillStyle = 'rgb(20, 20, 20)';
            cx.beginPath();
            cx.moveTo(midX - 24, midY + 28);
            cx.lineTo(midX + 24, midY + 28);
            cx.lineTo(midX, midY + 52);
            cx.closePath();
            cx.fill();

            cx.strokeStyle = 'rgb(20, 20, 20)';
            cx.lineWidth = 10;
            cx.beginPath();
            cx.arc(midX - 25, midY + 62, 25, 0, Math.PI * 0.9);
            cx.stroke();
            cx.beginPath();
            cx.arc(midX + 25, midY + 62, 25, Math.PI * 0.1, Math.PI);
            cx.stroke();
        } else if (currentPreset === 'skull') {
            // High-contrast Skull
            cx.fillStyle = 'rgb(245, 245, 245)';
            cx.beginPath();
            cx.arc(midX, midY - 25, 145, 0, Math.PI * 2);
            cx.fill();
            cx.fillRect(midX - 85, midY + 50, 170, 110);

            // Huge black eye sockets & nasal cavity
            cx.fillStyle = 'rgb(10, 10, 10)';
            [-58, 58].forEach(ox => {
                cx.beginPath();
                cx.arc(midX + ox, midY - 20, 44, 0, Math.PI * 2);
                cx.fill();
            });
            cx.beginPath();
            cx.moveTo(midX, midY + 15);
            cx.lineTo(midX - 26, midY + 68);
            cx.lineTo(midX + 26, midY + 68);
            cx.closePath();
            cx.fill();

            // Teeth bars
            for (let tx = -65; tx <= 65; tx += 26) {
                cx.fillRect(midX + tx - 5, midY + 95, 10, 55);
            }
            cx.fillRect(midX - 85, midY + 118, 170, 10);
        } else {
            // Custom bold multi-line text
            const words = (textInput.value || 'SÜRPRİZ').trim().split(/\s+/);
            cx.fillStyle = 'rgb(15, 15, 15)';
            cx.textAlign = 'center';
            cx.textBaseline = 'middle';
            if (words.length === 1) {
                const fs = Math.min(200, Math.floor((W * 0.85) / Math.max(1, words[0].length * 0.62)));
                cx.font = `900 ${fs}px Inter, sans-serif`;
                cx.fillText(words[0], midX, midY);
            } else {
                const maxLen = Math.max(...words.map(w => w.length));
                const fs = Math.min(135, Math.floor((W * 0.85) / Math.max(1, maxLen * 0.62)));
                cx.font = `900 ${fs}px Inter, sans-serif`;
                const totalH = words.length * (fs * 1.15);
                words.forEach((w, idx) => {
                    cx.fillText(w, midX, midY - totalH / 2 + (idx + 0.5) * (fs * 1.15));
                });
            }
        }

        // Apply slight Gaussian smoothing so the target has smooth continuous gradients
        const smoothC = document.createElement('canvas');
        smoothC.width = W; smoothC.height = H;
        const sCtx = smoothC.getContext('2d');
        sCtx.filter = 'blur(6px)';
        sCtx.drawImage(c, 0, 0);
        return smoothC;
    }

    function render() {
        const W = canvas.width, H = canvas.height;
        const targetCanvas = buildHiddenTargetCanvas(W, H);
        const tData = targetCanvas.getContext('2d').getImageData(0, 0, W, H).data;
        const out = ctx.createImageData(W, H);

        const period = parseInt(slider1.value); // 4..14 px
        const modStrength = parseInt(slider2.value) / 100; // 0.25..0.80

        if (currentTech === 'stripes') {
            // Technique 1: Pulse-Width / Luminance Modulated Op-Art Zigzag Stripes!
            // Up close, high-contrast black/white zigzag waves dominate foveal vision.
            // When squinting, the high-frequency carrier wave averages out to the exact hidden portrait!
            for (let y = 0; y < H; y++) {
                const zig = Math.sin(y * 0.11) * (period * 0.85);
                for (let x = 0; x < W; x++) {
                    const idx = (y * W + x) * 4;
                    const lum = (0.299 * tData[idx] + 0.587 * tData[idx + 1] + 0.114 * tData[idx + 2]) / 255;

                    // Carrier wave oscillating between 0 and 1
                    const wave = 0.5 + 0.5 * Math.sin(((x + zig) / period) * Math.PI * 2);

                    // Blend carrier wave with target luminance
                    // When eyes are open, high-contrast wave edges dominate; when squinted, mean luminance = lum!
                    const threshold = 0.5 + (0.5 - lum) * modStrength;
                    const val = wave > threshold ? 245 : 12;

                    out.data[idx] = val;
                    out.data[idx + 1] = val;
                    out.data[idx + 2] = val;
                    out.data[idx + 3] = 255;
                }
            }
            ctx.putImageData(out, 0, 0);
        } else {
            // Technique 2: True Registered MIT Hybrid Image (Low-Pass Far Target + High-Pass Near Portrait/Pattern)
            // Blur the Far target more strongly so it's invisible up close
            const lpCanvas = document.createElement('canvas');
            lpCanvas.width = W; lpCanvas.height = H;
            const lpCtx = lpCanvas.getContext('2d');
            lpCtx.filter = `blur(${period * 2.4}px)`;
            lpCtx.drawImage(targetCanvas, 0, 0);
            const lpData = lpCtx.getImageData(0, 0, W, H).data;

            // Draw detailed Near Face (Glasses, Mustache, Wrinkles, Geometric Hatching) aligned to the exact same center!
            const nearC = document.createElement('canvas');
            nearC.width = W; nearC.height = H;
            const nCtx = nearC.getContext('2d');
            nCtx.fillStyle = 'rgb(128,128,128)';
            nCtx.fillRect(0, 0, W, H);

            const mx = W / 2, my = H / 2;
            nCtx.strokeStyle = '#ffffff';
            nCtx.lineWidth = 3.5;

            // Concentric fine rings & radial lines
            for (let r = 15; r < 380; r += 10) {
                nCtx.beginPath();
                nCtx.arc(mx, my, r, 0, Math.PI * 2);
                nCtx.strokeStyle = r % 20 === 0 ? '#f8fafc' : '#1e293b';
                nCtx.lineWidth = 2;
                nCtx.stroke();
            }

            // Sharp Eyeglasses, Bushy Eyebrows, Mustache & Happy Grin in Near-Field!
            nCtx.strokeStyle = '#000000';
            nCtx.lineWidth = 6;
            [-55, 55].forEach(ox => {
                nCtx.strokeRect(mx + ox - 40, my - 52, 80, 52);
                // Forehead & cheek hatching lines
                for (let k = -25; k <= 25; k += 8) {
                    nCtx.beginPath();
                    nCtx.moveTo(mx + ox + k, my - 48);
                    nCtx.lineTo(mx + ox + k, my - 4);
                    nCtx.stroke();
                }
            });
            // Bridge of glasses
            nCtx.beginPath();
            nCtx.moveTo(mx - 15, my - 28);
            nCtx.lineTo(mx + 15, my - 28);
            nCtx.stroke();

            // Mustache fine vertical strokes
            for (let k = -68; k <= 68; k += 6) {
                nCtx.beginPath();
                nCtx.moveTo(mx + k, my + 32);
                nCtx.lineTo(mx + k * 1.15, my + 68);
                nCtx.stroke();
            }

            const nearBlurC = document.createElement('canvas');
            nearBlurC.width = W; nearBlurC.height = H;
            const nbCtx = nearBlurC.getContext('2d');
            nbCtx.filter = 'blur(4px)';
            nbCtx.drawImage(nearC, 0, 0);

            const nData = nCtx.getImageData(0, 0, W, H).data;
            const nbData = nbCtx.getImageData(0, 0, W, H).data;

            for (let i = 0; i < lpData.length; i += 4) {
                const hp = (nData[i] - nbData[i]) * 2.4;
                const lp = 128 + (lpData[i] - 128) * modStrength * 1.25;
                const v = Math.min(255, Math.max(0, Math.round(lp + hp)));
                out.data[i] = v;
                out.data[i + 1] = v;
                out.data[i + 2] = v;
                out.data[i + 3] = 255;
            }
            ctx.putImageData(out, 0, 0);
        }
    }

    render();
</script>
</body>
</html>
